[package]
name = "ts-rt-stubs"
version.workspace = true
edition.workspace = true
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
libc = "0.2"
once_cell = "1.19.0"
sonic-rs = "0.5.8"
regex = "1.10.4"
slabmalloc = { version = "0.11.0", default-features = false }
crossbeam-deque = "0.8.7"
crossbeam-utils = "0.8.22"
mio = { version = "1.2.2", features = ["net", "os-ext"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.6"

[features]
default = ["debug_rc"]
debug_rc = []
